# .github/workflows/xsec.yml
# autosolve_skip: parent brief authorized — modal cap workaround, no error condition
# karpathy_checked: routing infra, not new ML
#
# XSEC Full-S&P-500 Cross-Sectional XGBoost Backtest — GitHub Actions
#
# PURPOSE:
#   Modal-disabled fallback (2026-05-20). When the Modal workspace billing
#   cap is reached, the dispatcher re-routes XSEC mega-jobs (ticker="ALL",
#   strategy contains "xsec") here. The Modal version uses A10G GPU + 32GB
#   RAM in ~1-2hr; this CPU version uses tree_method=hist on a 4-core
#   ubuntu-latest runner in ~2-6hr.
#
# QUOTA:
#   - Free PRIVATE repo: 2000 min/mo (~33 hr/mo). Single xsec run <= 6hr.
#   - Free PUBLIC repo:  UNLIMITED. Recommended for heavy retrain cadence.
#   - timeout-minutes=350 is the safety ceiling (just under the 6h GH cap).
#
# TRIGGER:
#   - workflow_dispatch only. Invoked by the dispatcher's _submit_github_actions
#     xsec branch when job.ticker="ALL" + strategy contains "xsec".
#
# RESULT DELIVERY:
#   Writes artifacts to artifacts/v10_xsec_full500_<job_id>/ and uploads
#   the run_meta.json plus the per-fold output. Rollup commits results
#   back to backtests/_xsec/<job_id>/ so dispatcher's result poller finds
#   them.

name: xsec-full500

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy label (e.g. ML_XGB_v10_xsec_full500)'
        required: false
        default: 'ML_XGB_v10_xsec_full500'
      script:
        description: 'XSEC backtest script path'
        required: false
        default: 'scripts/backtest_xgb_v10_xsec.py'
      job_id:
        description: 'Dispatcher job ID for tracking (generated if empty)'
        required: false
        default: ''
      tickers_file:
        description: 'Ticker file path inside repo (default registry/sp500_tickers.csv)'
        required: false
        default: 'registry/sp500_tickers.csv'
      extra_env_json:
        description: 'JSON object of env overrides (e.g. {"XGB_TREE_METHOD":"hist","XGB_NO_TOPK":"1"})'
        required: false
        default: '{}'

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONUNBUFFERED: '1'
  NO_COLOR: '1'
  # CPU fallback for XSEC: force tree_method=hist (faster than 'exact' on CPU).
  XGB_TREE_METHOD: 'hist'
  # Use yfinance for OHLCV instead of local Drive parquet (not present on runner).
  BACKTEST_DATA_SOURCE: 'yfinance_daily'

jobs:
  # ---------------------------------------------------------------------------
  # xsec: single mega-job that runs the full S&P-500 cross-sectional backtest.
  # No matrix - one runner, one container, the entire panel.
  # ---------------------------------------------------------------------------
  xsec:
    name: XSEC full500 ${{ github.event.inputs.job_id }}
    runs-on: ubuntu-latest
    # Free-tier max is 6h (360 min). Keep at 350 to give cleanup steps a margin.
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BACKTEST_GITHUB_TOKEN || github.token }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              xgboost==2.1.3 \
              pandas==2.2.3 \
              numpy==1.26.4 \
              scikit-learn==1.6.1 \
              pyarrow==17.0.0 \
              python-dotenv==1.0.1 \
              yfinance==0.2.50 \
              tqdm==4.67.1
          fi

      - name: Resolve job ID
        id: job-meta
        run: |
          JOB_ID="${{ github.event.inputs.job_id }}"
          if [ -z "$JOB_ID" ]; then
            JOB_ID=$(python3 -c "import uuid; print(str(uuid.uuid4())[:8])")
          fi
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "output_dir=artifacts/v10_xsec_full500_${JOB_ID}" >> "$GITHUB_OUTPUT"

      - name: Apply extra_env overrides
        env:
          EXTRA_ENV_JSON: ${{ github.event.inputs.extra_env_json }}
        run: |
          if [ -z "$EXTRA_ENV_JSON" ] || [ "$EXTRA_ENV_JSON" = "{}" ]; then
            echo "No extra_env overrides for this run."
            exit 0
          fi
          python3 - <<'PYEOF'
          import json, os, re, sys
          raw = os.environ.get("EXTRA_ENV_JSON", "")
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"::warning::Invalid extra_env_json ({exc}) - skipping.")
              sys.exit(0)
          if not isinstance(data, dict):
              print(f"::warning::extra_env_json must be a JSON object - skipping.")
              sys.exit(0)
          allowed_name = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")
          gh_env_path = os.environ.get("GITHUB_ENV", "")
          if not gh_env_path:
              sys.exit(0)
          written = 0
          with open(gh_env_path, "a") as fh:
              for k, v in data.items():
                  if not allowed_name.match(str(k)):
                      continue
                  if v is None:
                      continue
                  val = str(v)
                  if "\n" in val:
                      fh.write(f"{k}<<__EXTRA_ENV_EOF__\n{val}\n__EXTRA_ENV_EOF__\n")
                  else:
                      fh.write(f"{k}={val}\n")
                  written += 1
          print(f"Forwarded {written} extra_env overrides.")
          PYEOF

      - name: Run XSEC full-500 backtest
        id: backtest
        env:
          JOB_ID:    ${{ steps.job-meta.outputs.job_id }}
          STRATEGY:  ${{ github.event.inputs.strategy }}
          TICKERS_FILE: ${{ github.event.inputs.tickers_file }}
          OUTPUT_DIR: ${{ steps.job-meta.outputs.output_dir }}
        run: |
          SCRIPT="${{ github.event.inputs.script }}"
          SCRIPT="${SCRIPT:-scripts/backtest_xgb_v10_xsec.py}"
          mkdir -p "$OUTPUT_DIR"
          echo "::group::Environment"
          echo "JOB_ID=$JOB_ID"
          echo "STRATEGY=$STRATEGY"
          echo "TICKERS_FILE=$TICKERS_FILE"
          echo "OUTPUT_DIR=$OUTPUT_DIR"
          echo "SCRIPT=$SCRIPT"
          echo "XGB_TREE_METHOD=$XGB_TREE_METHOD"
          python3 -c "import xgboost; print('xgboost', xgboost.__version__)"
          nproc
          free -h
          echo "::endgroup::"

          set +e
          python "$SCRIPT" \
            --tickers-file "$TICKERS_FILE" \
            --strategy     "$STRATEGY" \
            --job-id       "$JOB_ID" \
            --output-dir   "$OUTPUT_DIR" \
            2>&1 | tee /tmp/xsec_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "BACKTEST_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

          export BACKTEST_EXIT_CODE
          export OUTPUT_DIR
          python3 - <<'PYEOF'
          import json, os, sys, glob
          from datetime import datetime, timezone

          out_dir = os.environ["OUTPUT_DIR"]
          job_id = os.environ["JOB_ID"]
          strategy = os.environ["STRATEGY"]
          exit_code = int(os.environ.get("BACKTEST_EXIT_CODE", "1"))

          result_payload = None
          try:
              with open("/tmp/xsec_output.txt") as fh:
                  for line in reversed(fh.readlines()):
                      s = line.strip()
                      if s.startswith("{"):
                          try:
                              result_payload = json.loads(s)
                              break
                          except Exception:
                              continue
          except Exception:
              pass

          run_meta = None
          rm_paths = sorted(glob.glob(os.path.join(out_dir, "**", "run_meta.json"), recursive=True))
          if rm_paths:
              try:
                  with open(rm_paths[-1]) as fh:
                      run_meta = json.load(fh)
              except Exception:
                  pass

          record = {
              "job_id":        job_id,
              "ticker":        "ALL",
              "strategy":      strategy,
              "cloud":         "github_actions",
              "kind":          "xsec",
              "status":        "completed" if exit_code == 0 else "failed",
              "returncode":    exit_code,
              "completed_at":  datetime.now(timezone.utc).isoformat(),
              "runner_os":     "ubuntu-latest",
              "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "output_dir":    out_dir,
              "result":        result_payload,
              "run_meta":      run_meta,
          }
          dest = os.path.join(out_dir, "result.json")
          with open(dest, "w") as fh:
              json.dump(record, fh, indent=2)
          print(f"Wrote {dest}")
          PYEOF

      - name: Upload xsec artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsec-${{ steps.job-meta.outputs.job_id }}
          path: ${{ steps.job-meta.outputs.output_dir }}
          retention-days: 14
          if-no-files-found: warn

      - name: Commit results back to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "backtests/_xsec/${{ steps.job-meta.outputs.job_id }}"
          cp -r "${{ steps.job-meta.outputs.output_dir }}/." \
                "backtests/_xsec/${{ steps.job-meta.outputs.job_id }}/" || true
          git add "backtests/_xsec/${{ steps.job-meta.outputs.job_id }}/" || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "xsec: result for run ${{ github.run_id }} job ${{ steps.job-meta.outputs.job_id }}"

          MAX_ATTEMPTS=8
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if git push origin HEAD:main 2>&1 | tee /tmp/push.log; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            if ! grep -q -e "rejected" -e "fetch first" -e "non-fast-forward" /tmp/push.log; then
              echo "Push failed for non-race reason - aborting:"
              cat /tmp/push.log
              exit 1
            fi
            SLEEP=$(( (RANDOM % 25) + 5 ))
            echo "Push race lost ($attempt/$MAX_ATTEMPTS) - rebasing & retrying in ${SLEEP}s"
            git pull --rebase --autostash origin main || exit 1
            sleep $SLEEP
          done
          echo "::error::Push failed after $MAX_ATTEMPTS attempts"
          exit 1
